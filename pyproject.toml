[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudequiv"
version = "1.0.0"
description = "Machine-readable AWS / Azure / GCP / OCI service equivalency catalog with an executive-grade CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
cloudequiv = "cloudequiv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Validate catalog (fails the build on any data error)
        run: cloudequiv validate
      - name: Committed diagrams must be current
        run: cloudequiv diagrams --check
      - run: python -m pytest -q
      - name: Run every lab end to end
        run: ./labs/run_all.sh
      - name: Build site (smoke test)
        run: cloudequiv site --out site
